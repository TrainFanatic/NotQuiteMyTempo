[project]
name = "nqmt-live-transcription"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "soundfile>=0.12,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "cmake>=3.20,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
